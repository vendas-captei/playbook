document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-conn\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <div class=\"eco-card key\">\n            <div class=\"ec-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3z\"><\u002Fpath><path d=\"M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div class=\"ec-nm\">Copiloto<\u002Fdiv>\n            <div class=\"ec-ds\">Atendimento e qualificação.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"eco-conn\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <div class=\"eco-card\">\n            <div class=\"ec-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"9\" cy=\"7\" r=\"4\"><\u002Fcircle><path d=\"M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div class=\"ec-nm\">Corretores<\u002Fdiv>\n            <div class=\"ec-ds\">Negociação e fechamento.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"eco-conn\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <div class=\"eco-card\">\n            <div class=\"ec-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 17l6-6 4 4 8-8M21 7v5M21 7h-5\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div class=\"ec-nm\">Vendas<\u002Fdiv>\n            <div class=\"ec-ds\">Mais negócios fechados.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"eco-punch fx\" style=\"--d:480ms\">\n          <span class=\"ep-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2l2.4 7.4H22l-6 4.6 2.3 7.4-6.3-4.6L5.7 21.4 8 14 2 9.4h7.6z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <span class=\"ep-t\">Mais do que uma IA de atendimento: uma estrutura para <b>gerar, atender e converter<\u002Fb> mais oportunidades.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"foot\">\n      <div class=\"brand\">\n        <img class=\"logo cp logo-white\" src=\"e914656d-9859-481b-b54e-ecdcf43ce652\" alt=\"Copiloto\">\n        <img class=\"logo cp logo-dark\" src=\"e91045d2-2b52-4269-a218-cf93a5da4bad\" alt=\"Copiloto\">\n        <span class=\"byline\">by<\u002Fspan>\n        <img class=\"logo ct logo-white\" src=\"5fcaefb2-0d37-4e9d-a7f8-9129f2f737ba\" alt=\"Captei\">\n        <img class=\"logo ct logo-dark\" src=\"387dd2e1-5221-4cfb-ab06-410f394bb63e\" alt=\"Captei\">\n      <\u002Fdiv>\n      <span class=\"pager\"><b>19<\u002Fb> / 20<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ S15 — próximos passos ============ -->\n  <section class=\"s-light\" data-label=\"O que falta para avançarmos\">\n    <div class=\"slide has-foot\">\n      <h1 class=\"head fx\" style=\"--d:60ms; font-size:clamp(46px,4.6vw,84px); margin-top:6px;\">O que falta para <span class=\"grad\">avançarmos?<\u002Fspan><\u002Fh1>\n      <p class=\"lead fx\" style=\"--d:180ms; margin-top:18px; max-width:60ch; font-size:27px;\">Existe alguma dúvida, preocupação ou informação que precisamos esclarecer antes de iniciar?<\u002Fp>\n      <div class=\"paths\">\n        <div class=\"path lead fx\" style=\"--d:300ms\">\n          <div class=\"p-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <h3>Avançar com a implementação<\u002Fh3>\n          <p>A solução faz sentido para a operação e estamos prontos para iniciar.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"path fx\" style=\"--d:400ms\">\n          <div class=\"p-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7a8.5 8.5 0 0 1-.9-3.8A8.38 8.38 0 0 1 12.5 3 8.38 8.38 0 0 1 21 11.5z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <h3>Esclarecer algum ponto<\u002Fh3>\n          <p>Existe alguma dúvida ou preocupação que ainda precisa ser discutida.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"path fx\" style=\"--d:500ms\">\n          <div class=\"p-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"9\" cy=\"7\" r=\"4\"><\u002Fcircle><path d=\"M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <h3>Validar internamente<\u002Fh3>\n          <p>É necessário envolver outros decisores antes da definição.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"path-sub fx\" style=\"--d:600ms\">Você não precisa de <b>mais leads<\u002Fb>. Precisa parar de perder os que já tem.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"foot\">\n      <div class=\"brand\">\n        <img class=\"logo cp logo-white\" src=\"e914656d-9859-481b-b54e-ecdcf43ce652\" alt=\"Copiloto\">\n        <img class=\"logo cp logo-dark\" src=\"e91045d2-2b52-4269-a218-cf93a5da4bad\" alt=\"Copiloto\">\n        <span class=\"byline\">by<\u002Fspan>\n        <img class=\"logo ct logo-white\" src=\"5fcaefb2-0d37-4e9d-a7f8-9129f2f737ba\" alt=\"Captei\">\n        <img class=\"logo ct logo-dark\" src=\"387dd2e1-5221-4cfb-ab06-410f394bb63e\" alt=\"Captei\">\n      <\u002Fdiv>\n      <span class=\"pager\"><b>20<\u002Fb> / 20<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- INSERT-SLIDES -->\n\n<\u002Fdeck-stage>\n\n<script src=\"e6815159-7425-46a7-91b1-66fb2412e7be\"><\u002Fscript>\n<script src=\"b9e04e88-f4b6-4234-ab9f-8900926cf678\"><\u002Fscript>\n<script src=\"9a86c2ae-5293-4a3d-882b-7d50f5aa0c9f\"><\u002Fscript>\n<script>\n  /* CSS-keyframe entrance. deck-stage holds non-active slides at visibility:hidden;\n     assigning an animation in the same tick a slide becomes active leaves it frozen\n     (pending) at opacity:0. So we add the .anim-in class two frames later, once the\n     slide is actually painted visible — plus a safety net that force-reveals content\n     if the animation ever fails to advance, so nothing is ever left hidden. */\n  (function(){\n    const deck = document.querySelector('deck-stage');\n    if(!deck) return;\n    function playIn(slide){\n      if(!slide) return;\n      slide.classList.remove('anim-in');\n      requestAnimationFrame(function(){\n        requestAnimationFrame(function(){\n          slide.classList.add('anim-in');\n          setTimeout(function(){\n            const fx = slide.querySelector('.fx');\n            if(fx && parseFloat(getComputedStyle(fx).opacity) < 0.05){\n              slide.classList.remove('anim-in'); /* fall back to visible base */\n            }\n          }, 1700);\n        });\n      });\n    }\n    deck.addEventListener('slidechange', function(e){ playIn(e.detail && e.detail.slide); });\n    requestAnimationFrame(function(){\n      const a = deck.querySelector('[data-deck-active]');\n      if(a && !a.classList.contains('anim-in')) playIn(a);\n    });\n  })();\n<\u002Fscript>\n<script>\n  /* build the dot fields for S2 */\n  (function(){\n    const mk = (el, n, onCount) => {\n      if(!el) return;\n      for(let i=0;i<n;i++){ const d=document.createElement('i'); if(i<onCount) d.className='on'; el.appendChild(d); }\n    };\n    mk(document.getElementById('df-in'), 100, 100);\n    mk(document.getElementById('df-out'), 100, 38);\n    // make the \"38 gerados\" gradient number readable\n    document.querySelectorAll('.grad-num').forEach(n=>{\n      n.style.background='var(--grad)'; n.style.webkitBackgroundClip='text'; n.style.backgroundClip='text'; n.style.color='transparent';\n    });\n  })();\n\n  /* ROI live calculator (slide 13) */\n  (function(){\n    const valorEl = document.getElementById('calc-valor');\n    const comEl   = document.getElementById('calc-com');\n    const leadsEl = document.getElementById('calc-leads');\n    if(!valorEl) return;\n    const outDeal = document.getElementById('out-deal');\n    const outMonth= document.getElementById('out-month');\n    const outYear = document.getElementById('out-year');\n    const LS='copiloto_roi_v1';\n\n    const onlyDigits = s => (s||'').replace(/[^\\d]/g,'');\n    const fmtInt = n => new Intl.NumberFormat('pt-BR').format(Math.round(n));\n    const money  = n => 'R$ ' + fmtInt(n);\n\n    function parseValor(){ return parseInt(onlyDigits(valorEl.value)||'0',10); }\n    function parseCom(){ return parseFloat((comEl.value||'0').replace(',', '.')) || 0; }\n    function parseLeads(){ let n=parseInt(onlyDigits(leadsEl.value)||'0',10); return n; }\n\n    function compute(){\n      const valor = parseValor();\n      const com = parseCom();\n      const leads = Math.max(0, parseLeads());\n      const deal = valor * (com/100);\n      const month = deal * leads;\n      outDeal.textContent  = money(deal);\n      outMonth.textContent = money(month);\n      outYear.textContent  = money(month*12);\n      try{ localStorage.setItem(LS, JSON.stringify({v:valorEl.value, c:comEl.value, l:leadsEl.value})); }catch(e){}\n    }\n\n    // restore\n    try{\n      const s=JSON.parse(localStorage.getItem(LS)||'null');\n      if(s){ if(s.v)valorEl.value=s.v; if(s.c)comEl.value=s.c; if(s.l)leadsEl.value=s.l; }\n    }catch(e){}\n\n    // format valor with thousands separators as the user types\n    valorEl.addEventListener('input', ()=>{\n      const d=onlyDigits(valorEl.value);\n      valorEl.value = d ? fmtInt(parseInt(d,10)) : '';\n      compute();\n    });\n    comEl.addEventListener('input', compute);\n    leadsEl.addEventListener('input', ()=>{ leadsEl.value=onlyDigits(leadsEl.value); compute(); });\n    document.getElementById('calc-plus').addEventListener('click', ()=>{ leadsEl.value=String(parseLeads()+1); compute(); });\n    document.getElementById('calc-minus').addEventListener('click', ()=>{ leadsEl.value=String(Math.max(0,parseLeads()-1)); compute(); });\n\n    compute();\n  })();\n\n  /* Dimensionamento → recomendação de plano (slides 15 + 16) */\n  (function(){\n    const deck = document.querySelector('deck-stage');\n    const PLANS = {\n      Light:      { name:'Light',      price:1490, agents:1, users:2,  convos:500,  implant:1800, who:'Operações começando a automatizar.',\n                    feats:['Atendimento e qualificação 24h','Follow-up inteligente','Distribuição automática'] },\n      Pro:        { name:'Pró',        price:2290, agents:2, users:5,  convos:700,  implant:2700, who:'Operações em crescimento.',\n                    feats:['Tudo do Light','Integrações com o seu CRM','Mais capacidade de atendimento'] },\n      Business:   { name:'Business',   price:2990, agents:4, users:10, convos:1000, implant:3600, who:'Operações que não podem perder lead.',\n                    feats:['Tudo do Pró','Relatórios avançados','Distribuição inteligente'] },\n      Enterprise: { name:'Enterprise', price:4490, agents:6, users:18, convos:1500, implant:3600, who:'Operações de maior complexidade.',\n                    feats:['Tudo do Business','Suporte dedicado e prioritário','Estrutura sob medida'] }\n    };\n    const ORDER = ['Light','Pro','Business','Enterprise'];\n    const ADDON = { agent:320, user:89, convo:3 };\n    // Ecossistema incluso por plano, conforme o produto escolhido na configuração\n    const ECO = {\n      'Captação Ativa': { Light:null, Pro:'Captação Ativa Light', Business:'Captação Ativa Pro', Enterprise:'Captação Ativa Enterprise' },\n      'Indica+':        { Light:null, Pro:'Indica+ Starter',      Business:'Indica+ Controle',    Enterprise:'Indica+ Premium' },\n      'Outro':          { Light:null, Pro:null,                   Business:null,                 Enterprise:null }\n    };\n    const LS = 'copiloto_diag_v1';\n\n    const numerosEl   = document.getElementById('d-numeros');\n    if(!numerosEl) return;\n    const usuariosEl   = document.getElementById('d-usuarios');\n    const conversasEl  = document.getElementById('d-conversas');\n    const inputs = [numerosEl, usuariosEl, conversasEl];\n\n    const onlyDigits = s => (s||'').replace(/[^\\d]/g,'');\n    const num = el => parseInt(onlyDigits(el.value)||'0',10);\n    const fmtInt = n => new Intl.NumberFormat('pt-BR').format(n);\n    const money = n => 'R$ ' + fmtInt(n);\n\n    let recommended = 'Light';\n    let recoDetail = null;\n\n    function product(){ return (window.__copilotoConfig && window.__copilotoConfig.clientType) || 'Captação Ativa'; }\n    function ecoFor(plan){ const m = ECO[product()] || ECO['Captação Ativa']; return m[plan] || null; }\n    function ecoProductLabel(){ return product(); }\n    function ecoPlanLabel(eco){ return (eco||'').replace(product()+' ','').replace(/^Pro$/,'Pró').trim(); }\n\n    // custo total mensal do plano como base + adicionais necessários\n    function costOf(plan, numeros, usuarios, conversas){\n      const p = PLANS[plan];\n      const ea = Math.max(0, numeros - p.agents);\n      const eu = Math.max(0, usuarios - p.users);\n      const ec = Math.max(0, conversas - p.convos);\n      const monthly = p.price + ea*ADDON.agent + eu*ADDON.user + ec*ADDON.convo;\n      return { plan, ea, eu, ec, addons:(ea+eu+ec), monthly };\n    }\n\n    // recomenda: menor custo, mas sobe para o plano maior quando o custo fica perto\n    // (add-ons que aproximam do próximo plano → vale mais o plano maior, que inclui mais).\n    function recommend(){\n      const numeros = Math.max(1, num(numerosEl));\n      const usuarios = Math.max(1, num(usuariosEl));\n      const conversas = Math.max(0, num(conversasEl));\n      const TOL = 0.12; // dentro de 12% do mais barato, prefere o plano maior\n      const costs = ORDER.map(plan => costOf(plan, numeros, usuarios, conversas));\n      const minMonthly = Math.min.apply(null, costs.map(c=>c.monthly));\n      let chosen = costs[0];\n      for(const c of costs){ if(c.monthly <= minMonthly*(1+TOL)) chosen = c; } // último que passa = maior tier\n      recoDetail = chosen;\n      return chosen.plan;\n    }\n\n    function paintTiers(){\n      document.querySelectorAll('.tier').forEach(t=>{\n        t.classList.toggle('on', t.dataset.tier === recommended);\n      });\n    }\n\n    function chk(){ return '<span class=\"chk\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"/><\u002Fsvg><\u002Fspan>'; }\n    function giftSvg(){ return '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z\"/><\u002Fsvg>'; }\n    function boldInherit(f){ return f.replace(/^Tudo do (\\S+)/, '<b>Tudo do $1<\u002Fb>'); }\n\n    function buildPlans(){\n      const grid = document.getElementById('plans-grid');\n      if(!grid) return;\n      grid.innerHTML = ORDER.map(key=>{\n        const p = PLANS[key];\n        const eco = ecoFor(key);\n        const caps = '<b>'+p.agents+'<\u002Fb> '+(p.agents===1?'número':'números')+' · <b>'+p.users+'<\u002Fb> usuários · <b>'+fmtInt(p.convos)+'<\u002Fb> conversas/mês';\n        const items = [caps].concat(p.feats);\n        const lis = items.map(f=>'<li>'+chk()+'<span>'+boldInherit(f)+'<\u002Fspan><\u002Fli>').join('');\n        const ecoBox = eco\n          ? '<div class=\"peco\"><div class=\"peco-inner\"><span class=\"gift\">'+giftSvg()+'<\u002Fspan><span><b>Ecossistema Captei<\u002Fb><br>Plano '+ecoPlanLabel(eco)+' do '+ecoProductLabel()+'<\u002Fspan><\u002Fdiv><\u002Fdiv>'\n          : '<div class=\"peco\"><\u002Fdiv>';\n        return '<div class=\"plan\" data-plan=\"'+key+'\">'\n          + '<div class=\"badge\">Recomendado<\u002Fdiv>'\n          + '<div class=\"pname\">'+p.name+'<\u002Fdiv>'\n          + '<div class=\"pprice\"><span class=\"pre\">R$<\u002Fspan>'+fmtInt(p.price)+'<small> /mês<\u002Fsmall><\u002Fdiv>'\n          + '<div class=\"pimplant\">Implantação <b>'+money(p.implant)+'<\u002Fb> · única<\u002Fdiv>'\n          + '<ul class=\"pfeat\">'+lis+'<\u002Ful>'\n          + ecoBox\n          + '<\u002Fdiv>';\n      }).join('');\n      document.querySelectorAll('.plan[data-plan]').forEach(pl=> pl.classList.toggle('reco', pl.dataset.plan === recommended));\n    }\n\n    function renderReco(){\n      const p = PLANS[recommended];\n      const d = recoDetail || costOf(recommended,1,1,0);\n      const set = (id,v)=>{ const el=document.getElementById(id); if(el) el.textContent=v; };\n      set('reco-name', p.name);\n      set('reco-price', fmtInt(d.monthly));\n      const bd = document.getElementById('reco-breakdown');\n      const addonTotal = d.monthly - p.price;\n      if(bd){ bd.textContent = d.addons>0 ? (money(p.price)+' + '+money(addonTotal)+' em adicionais') : 'Plano completo, sem adicionais'; }\n\n      const numeros = Math.max(1, num(numerosEl)), usuarios = Math.max(1, num(usuariosEl)), conversas = Math.max(0, num(conversasEl));\n      const capItem = (total, included, extra, unit, exLabel) => {\n        const ex = extra>0 ? ' <span style=\"opacity:.82\">('+fmtInt(included)+' + '+fmtInt(extra)+' '+exLabel+')<\u002Fspan>' : '';\n        return { addon: extra>0, html: '<b>'+(typeof total==='number'?fmtInt(total):total)+'<\u002Fb> '+unit+ex };\n      };\n      const totN = Math.max(numeros, p.agents), totU = Math.max(usuarios, p.users), totC = Math.max(conversas, p.convos);\n      const caps = [\n        capItem(totN, p.agents, d.ea, (totN===1?'número conectado':'números conectados'), 'adicional'),\n        capItem(totU, p.users, d.eu, 'usuários', 'adicional'),\n        capItem(totC, p.convos, d.ec, 'conversas/mês', 'excedentes')\n      ];\n      let html = caps.map(it=>'<li'+(it.addon?' class=\"addon\"':'')+'>'+chk()+'<span>'+it.html+'<\u002Fspan><\u002Fli>').join('');\n      html += p.feats.map(f=>'<li>'+chk()+'<span>'+boldInherit(f)+'<\u002Fspan><\u002Fli>').join('');\n      const feat = document.getElementById('reco-feat'); if(feat) feat.innerHTML = html;\n\n      const eco = ecoFor(recommended);\n      const ecoEl = document.getElementById('reco-eco');\n      if(ecoEl){\n        if(eco){ ecoEl.style.display='flex'; ecoEl.innerHTML = '<span class=\"eco-gift\">'+giftSvg()+'<\u002Fspan><div class=\"eco-txt\"><span class=\"eco-tag\">Bônus incluso<\u002Fspan><span class=\"eco-main\"><b>Ecossistema Captei<\u002Fb><\u002Fspan><span class=\"eco-line\">Acesso ao plano <b>'+ecoPlanLabel(eco)+'<\u002Fb> do '+ecoProductLabel()+'<\u002Fspan><span class=\"eco-micro\">Geração contínua de oportunidades para a sua operação.<\u002Fspan><\u002Fdiv>'; }\n        else { ecoEl.style.display='none'; ecoEl.innerHTML=''; }\n      }\n      const imp = document.getElementById('reco-implant');\n      if(imp){ imp.innerHTML = '<span class=\"imp-tag\">Única<\u002Fspan> Implantação <b>'+money(p.implant)+'<\u002Fb> na contratação'; }\n\n      const why = d.addons>0\n        ? ('Cobre a operação sem precisar subir de plano — '+(d.eu>0?'usuário':d.ea>0?'número':'conversa')+' adicional sai mais em conta.')\n        : p.who;\n      set('reco-justify', why);\n\n      document.querySelectorAll('.plan[data-plan]').forEach(pl=>{\n        pl.classList.toggle('reco', pl.dataset.plan === recommended);\n      });\n    }\n\n    function update(){\n      recommended = recommend();\n      paintTiers();\n      renderReco();\n      try{ localStorage.setItem(LS, JSON.stringify({\n        nm:numerosEl.value, u:usuariosEl.value, cv:conversasEl.value, r:recommended\n      })); }catch(e){}\n    }\n\n    // restore\n    try{\n      const s = JSON.parse(localStorage.getItem(LS)||'null');\n      if(s){ if(s.nm)numerosEl.value=s.nm; if(s.u)usuariosEl.value=s.u; if(s.cv)conversasEl.value=s.cv; }\n    }catch(e){}\n\n    inputs.forEach(el=> el.addEventListener('input', ()=>{ el.value=onlyDigits(el.value); update(); }));\n\n    // advance button → investment slide\n    const goBtn = document.getElementById('diag-go');\n    function deckIndexOf(sel){ return [...deck.querySelectorAll('section')].findIndex(s=> s.getAttribute('data-label')===sel); }\n    if(goBtn && deck){\n      goBtn.addEventListener('click', ()=>{ const i=deckIndexOf('Investimento'); if(i>=0) deck.goTo(i); });\n    }\n\n    // investment reveal interaction — display toggle (robust against deck slotted-opacity)\n    const investSection = [...document.querySelectorAll('section')].find(s=> s.getAttribute('data-label')==='Investimento');\n    const recoView = investSection ? investSection.querySelector('.reco-view') : null;\n    const allView  = investSection ? investSection.querySelector('.all-view') : null;\n    const toggleBtn = document.getElementById('reco-toggle');\n    const backBtn = document.getElementById('all-back');\n    function showAll(on){\n      if(!recoView || !allView) return;\n      const show = on ? allView : recoView;\n      const hide = on ? recoView : allView;\n      hide.style.setProperty('display','none','important');\n      show.style.setProperty('display','flex','important');\n    }\n    if(toggleBtn) toggleBtn.addEventListener('click', ()=> showAll(true));\n    if(backBtn) backBtn.addEventListener('click', ()=> showAll(false));\n    // always enter the investment slide on the recommendation view (vendor controls reveal)\n    if(deck && investSection){\n      deck.addEventListener('slidechange', e=>{ if(e.detail && e.detail.slide === investSection) showAll(false); });\n    }\n    showAll(false); // initial state\n\n    // produto (Captação Ativa / Indica+) → primeiro nó do slide Ecossistema\n    function applyEcoNode(){\n      const nm = document.getElementById('eco-prod-name');\n      const ds = document.getElementById('eco-prod-desc');\n      if(!nm || !ds) return;\n      if(product() === 'Indica+'){ nm.textContent = 'Indica+'; ds.textContent = 'Indicações que viram oportunidades.'; }\n      else if(product() === 'Outro'){ nm.textContent = 'Captação'; ds.textContent = 'Origem das oportunidades.'; }\n      else { nm.textContent = 'Captação Ativa'; ds.textContent = 'Geração de oportunidades.'; }\n    }\n\n    buildPlans();\n    applyEcoNode();\n    update();\n\n    // reage à troca de produto / nome no menu de configuração\n    window.addEventListener('configchange', function(){ buildPlans(); renderReco(); applyEcoNode(); });\n  })();<\u002Fscript>\n<script>\n  /* Rail (mini-slides) toggle — button bottom-left + keyboard \"R\".\n     Uses deck-stage's native __deck_rail_visible message, which persists the choice. */\n  (function(){\n    let railOn = true;\n    try{ if(localStorage.getItem('deck-stage.railVisible') === '0') railOn = false; }catch(e){}\n\n    const btn = document.createElement('button');\n    btn.id = 'rail-toggle';\n    btn.type = 'button';\n    btn.innerHTML = '<svg viewBox=\"0 0 24 24\" width=\"17\" height=\"17\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"6\" height=\"16\" rx=\"1.4\"/><line x1=\"13\" y1=\"7\" x2=\"20\" y2=\"7\"/><line x1=\"13\" y1=\"12\" x2=\"20\" y2=\"12\"/><line x1=\"13\" y1=\"17\" x2=\"20\" y2=\"17\"/><\u002Fsvg><span><\u002Fspan>';\n    const css = document.createElement('style');\n    css.textContent = `\n      #rail-toggle{ position:fixed; left:14px; bottom:14px; z-index:2147483600;\n        display:flex; align-items:center; gap:8px; padding:9px 13px 9px 11px;\n        background:rgba(18,24,41,.74); color:#E6EBF6; border:1px solid rgba(255,255,255,.16);\n        border-radius:11px; cursor:pointer; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);\n        font:600 13px/1 'Plus Jakarta Sans',system-ui,sans-serif; letter-spacing:.01em;\n        opacity:.34; transition:opacity .18s ease, background .18s ease; }\n      #rail-toggle:hover{ opacity:1; background:rgba(18,24,41,.92); }\n      #rail-toggle span::after{ content:'Ocultar slides'; }\n      #rail-toggle[data-off] span::after{ content:'Mostrar slides'; }\n      @media print{ #rail-toggle{ display:none !important; } }\n    `;\n    document.head.appendChild(css);\n    document.body.appendChild(btn);\n\n    function apply(){\n      try{ window.postMessage({ type:'__deck_rail_visible', on: railOn }, '*'); }catch(e){}\n      btn.toggleAttribute('data-off', !railOn);\n    }\n    function toggle(){ railOn = !railOn; apply(); }\n\n    btn.addEventListener('click', toggle);\n    window.addEventListener('keydown', function(e){\n      if(e.key === 'r' || e.key === 'R'){\n        const t = e.target;\n        if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;\n        toggle();\n      }\n    });\n    // sync deck to the stored preference on load\n    setTimeout(apply, 300);\n  })();\n\n  /* Fullscreen + Baixar PDF — botões flutuantes (canto inferior direito, revelam no hover) */\n  (function(){\n    const css = document.createElement('style');\n    css.textContent = `\n      #deck-tools{ position:fixed; right:14px; bottom:14px; z-index:2147483600; display:flex; gap:10px; }\n      #deck-tools button{ display:flex; align-items:center; gap:8px; padding:9px 13px 9px 11px;\n        background:rgba(18,24,41,.74); color:#E6EBF6; border:1px solid rgba(255,255,255,.16);\n        border-radius:11px; cursor:pointer; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);\n        font:600 13px/1 'Plus Jakarta Sans',system-ui,sans-serif; letter-spacing:.01em;\n        opacity:.34; transition:opacity .18s ease, background .18s ease; }\n      #deck-tools button:hover{ opacity:1; background:rgba(18,24,41,.92); }\n      #deck-tools button svg{ width:17px; height:17px; flex:none; }\n      @media print{ #deck-tools{ display:none !important; } }\n    `;\n    document.head.appendChild(css);\n\n    const wrap = document.createElement('div');\n    wrap.id = 'deck-tools';\n\n    // --- Fullscreen ---\n    const fsBtn = document.createElement('button');\n    fsBtn.type = 'button';\n    const fsIconExpand = '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3\"/><\u002Fsvg>';\n    const fsIconExit = '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3\"/><\u002Fsvg>';\n    function renderFs(){\n      const on = !!document.fullscreenElement;\n      fsBtn.innerHTML = (on ? fsIconExit : fsIconExpand) + '<span>' + (on ? 'Sair (Esc)' : 'Tela cheia') + '<\u002Fspan>';\n    }\n    fsBtn.addEventListener('click', function(){\n      if(document.fullscreenElement){ document.exitFullscreen && document.exitFullscreen(); }\n      else { const el = document.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el); }\n    });\n    document.addEventListener('fullscreenchange', renderFs);\n    renderFs();\n\n    // --- Baixar PDF (imprime o deck no estado atual) ---\n    const pdfBtn = document.createElement('button');\n    pdfBtn.type = 'button';\n    pdfBtn.innerHTML = '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3\"/><\u002Fsvg><span>Baixar PDF<\u002Fspan>';\n    pdfBtn.addEventListener('click', function(){\n      // sai do fullscreen antes de imprimir (o diálogo de impressão não aparece em fullscreen)\n      const go = function(){ window.print(); };\n      if(document.fullscreenElement && document.exitFullscreen){ document.exitFullscreen().then(go).catch(go); }\n      else { go(); }\n    });\n\n    wrap.appendChild(fsBtn);\n    wrap.appendChild(pdfBtn);\n\n    // --- Configuração (menu interno) ---\n    const cfgBtn = document.createElement('button');\n    cfgBtn.type = 'button';\n    cfgBtn.innerHTML = '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z\"/><\u002Fsvg><span>Configuração<\u002Fspan>';\n    cfgBtn.addEventListener('click', function(){ if(window.__openConfig) window.__openConfig(); });\n    wrap.appendChild(cfgBtn);\n\n    document.body.appendChild(wrap);\n  })();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
