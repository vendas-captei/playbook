<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar do Time · Captei</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#283040;
    --tx:#e6edf3; --mut:#8b949e; --mut2:#5f6b7a;
    --blue:#3b82f6; --green:#22c55e; --amber:#f59e0b; --red:#f43f5e; --violet:#a855f7;
    --r:16px; --r2:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
  .head{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
  .title h1{margin:0;font-size:21px;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
  .title .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(34,191,113,.15)}
  .title p{margin:4px 0 0;color:var(--mut);font-size:12.5px}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
  .seg button{border:0;background:transparent;color:var(--mut);font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer;transition:.15s}
  .seg button.on{background:var(--blue);color:#fff}
  .seg button:not(.on):hover{color:var(--tx)}
  .periodbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:2px 0 16px}
  .periodbar .lbl{font-size:11px;color:var(--mut2);text-transform:uppercase;letter-spacing:.5px}
  .seg.small button{padding:6px 12px;font-size:12.5px}
  .range{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12.5px}
  .range input{background:var(--panel);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:7px 10px;font-size:12.5px;font-family:inherit;color-scheme:dark}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 18px}
  .chip{border:1px solid var(--line);background:var(--panel);color:var(--mut);font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.15s}
  .chip:hover{color:var(--tx);border-color:#3a4757}
  .chip.on{color:var(--tx);border-color:var(--blue);background:rgba(59,130,246,.14)}
  .chip .st{width:8px;height:8px;border-radius:50%}
  .grid{display:grid;gap:14px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
  .panel h3{margin:0 0 2px;font-size:13px;color:var(--mut);font-weight:600}
  .panel .sub{color:var(--mut2);font-size:11.5px;margin-bottom:12px}
  .idcard{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .av{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:17px;color:#fff}
  .idmeta{flex:1;min-width:180px}
  .idmeta .nm{font-size:18px;font-weight:700}
  .idmeta .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .tag{font-size:11px;color:var(--mut);background:var(--panel2);border:1px solid var(--line);padding:3px 9px;border-radius:999px}
  .statusbig{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;padding:9px 14px;border-radius:12px}
  .kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
  .kpi{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r2);padding:14px}
  .kpi .lab{font-size:12px;color:var(--mut);display:flex;justify-content:space-between;gap:8px}
  .kpi .per{font-size:10px;color:var(--mut2);text-transform:uppercase;letter-spacing:.4px;text-align:right}
  .kpi .val{font-size:22px;font-weight:750;margin:8px 0 2px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
  .kpi .val small{font-size:13px;color:var(--mut);font-weight:600}
  .kpi .adef{font-size:13px;color:var(--mut2);font-style:italic;margin:10px 0 4px}
  .bar{height:7px;background:#0b0f16;border-radius:999px;overflow:hidden;margin-top:9px}
  .bar > i{display:block;height:100%;border-radius:999px}
  .kmeta{display:flex;justify-content:space-between;margin-top:7px;font-size:11px;color:var(--mut)}
  .thermowrap{display:flex;gap:20px;align-items:stretch}
  .thermo{display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
  .tube{width:22px;flex:1;background:#0b0f16;border:1px solid var(--line);border-radius:999px;position:relative;overflow:hidden;min-height:150px}
  .tube > i{position:absolute;left:0;right:0;bottom:0;border-radius:999px;transition:height .6s cubic-bezier(.2,.7,.2,1)}
  .bulb{width:40px;height:40px;border-radius:50%;margin-top:-8px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;border:3px solid #0b0f16;z-index:2}
  .zones{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:2px 0;font-size:11px;color:var(--mut2)}
  .dims{flex:1;display:flex;flex-direction:column;gap:10px;justify-content:center;min-width:0}
  .dim .dl{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
  .dim .dl b{color:var(--tx);font-weight:600}
  .dim .dl span{color:var(--mut)}
  .empty{color:var(--mut2);font-size:13px;padding:18px;text-align:center;border:1px dashed var(--line);border-radius:12px}
  .ins{display:flex;flex-direction:column;gap:10px}
  .insrow{display:flex;gap:11px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-left-width:3px;border-radius:10px;padding:11px 13px}
  .insrow .ic{font-size:15px;margin-top:1px}
  .insrow .tx{font-size:13px;line-height:1.5}
  .insrow small{display:block;color:var(--mut);font-size:11.5px;margin-top:3px}
  .pulse{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
  .pcard{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r2);padding:13px;cursor:pointer;transition:.15s}
  .pcard:hover{border-color:var(--blue);transform:translateY(-2px)}
  .pcard .top{display:flex;align-items:center;gap:10px}
  .pcard .nm{font-weight:700;font-size:14px}
  .pcard .rl{font-size:11px;color:var(--mut)}
  .pcard .mini{display:flex;gap:5px;margin-top:11px;min-height:5px}
  .pcard .mini i{flex:1;height:5px;border-radius:999px;background:#0b0f16;overflow:hidden;position:relative}
  .pcard .mini i b{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
  .pfoot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11.5px;color:var(--mut)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:820px){.two{grid-template-columns:1fr}}
  .banner{font-size:11.5px;color:var(--mut2);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .spin{color:var(--mut);font-size:13px;padding:40px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="banner"><b style="color:var(--mut)">Dados ao vivo</b> — Ganhos e Atividades vêm do Pipedrive; termômetro vem das reuniões do Meetrox. Itens marcados <b style="color:var(--mut)">"a definir"</b> aguardam a regra de cálculo combinada com você.</div>
  <div class="head">
    <div class="title">
      <h1><span class="dot"></span> Radar do Time</h1>
      <p id="crumb">carregando…</p>
    </div>
    <div class="seg" id="seg">
      <button data-v="time" class="on">Time</button>
      <button data-v="vendedor">Vendedor</button>
      <button data-v="funcao">Função</button>
      <button data-v="funil">Funil</button>
    </div>
  </div>
  <div class="periodbar">
    <span class="lbl">Período</span>
    <div class="seg small" id="pseg">
      <button data-p="hoje">Hoje</button>
      <button data-p="semana">Semana</button>
      <button data-p="mes" class="on">Mês</button>
      <button data-p="custom">Personalizado</button>
    </div>
    <div class="range" id="range" style="display:none">
      <input type="date" id="d1"><span>até</span><input type="date" id="d2">
    </div>
  </div>
  <div class="chips" id="chips" style="display:none"></div>
  <div class="grid" id="stage"><div class="spin">Carregando dados reais…</div></div>
</div>

<script>
let P=[], view='time', sel=null, period='mes';
const stage=document.getElementById('stage'), chips=document.getElementById('chips'), crumb=document.getElementById('crumb');

// ── Acesso (mesma lógica do Dashboard): admin/Gestão vê o time todo; colaborador vê só o seu. ──
let ADMIN=true, MYEMAIL=null;
function rdSession(){ try{ return JSON.parse(sessionStorage.getItem('captei_pb_session')||'{}'); }catch(e){ return {}; } }
async function resolvePerm(){
  const s=rdSession();
  ADMIN=!!(s.isAdmin || s.team==='Gestão');
  if(ADMIN) return;
  try{ const r=await fetch('/api/users'); const d=await r.json();
    const me=(d.users||[]).find(u=>(u.name||'').toLowerCase()===(s.name||'').toLowerCase());
    MYEMAIL = me ? ((me.user||me.email||'').toLowerCase()) : null;
  }catch(e){ MYEMAIL=null; }
}

const money=v=> 'R$ '+(v>=1000?(v/1000).toFixed(v%1000&&v<10000?1:0)+'k':v);
const fmt=(k,v)=> v==null?'—':(k.fmt==='money'?money(v):(''+v));
const clr=p=> p>=95?'var(--green)': p>=75?'var(--amber)':'var(--red)';
const stColor=a=> a==null?'var(--mut2)': a>=90?'var(--green)': a>=70?'var(--amber)':'var(--red)';
const stWord=a=> a==null?'sem meta': a>=90?'No ritmo': a>=70?'Atenção':'Fora do ritmo';
const zoneWord=s=> s>=75?'Forte': s>=55?'No caminho':'Precisa ajustar';
function pctK(k){ return (k.real==null||!k.meta)?null:Math.round(k.real/k.meta*100); }
function attain(p){ const xs=p.kpis.map(pctK).filter(x=>x!=null); return xs.length?Math.round(xs.reduce((a,b)=>a+Math.min(120,b),0)/xs.length):null; }
function callScore(p){ return p.call? p.call.overall : null; }

function kpiCard(k){
  if(k.real==null){ return `<div class="kpi"><div class="lab"><span>${k.lab}</span><span class="per">${k.per}</span></div>
    <div class="adef">a definir</div><div class="kmeta"><span>aguardando regra${k.meta?' · meta '+fmt(k,k.meta)+(k.un&&k.un!=='R$'?' '+k.un:''):''}</span></div></div>`; }
  const p=pctK(k), c=p==null?'var(--blue)':clr(p);
  return `<div class="kpi"><div class="lab"><span>${k.lab}</span><span class="per">${k.per}</span></div>
    <div class="val">${fmt(k,k.real)}${k.meta?` <small>/ ${fmt(k,k.meta)}${k.un&&k.un!=='R$'?' '+k.un:''}</small>`:(k.un&&k.un!=='R$'?` <small>${k.un}</small>`:'')}</div>
    ${p!=null?`<div class="bar"><i style="width:${Math.min(100,p)}%;background:${c}"></i></div>
    <div class="kmeta"><span style="color:${c};font-weight:700">${p}% da meta</span><span>${p>=100?'batida':'faltam '+fmt(k,Math.max(0,k.meta-k.real))}</span></div>`:''}</div>`;
}
function thermo(p){
  if(!p.call){ return `<div class="panel"><h3>Termômetro de ligações e reuniões</h3>
    <div class="empty">Nenhuma reunião qualificada no período.<br>Assim que o Meetrox transcrever, aparece aqui.</div></div>`; }
  const s=p.call.overall, c=clr(s>=75?100:s>=55?80:50);
  const dims=(p.call.dims||[]).map(d=>`<div class="dim"><div class="dl"><b>${d[0]}</b><span>${d[1]==null?'—':d[1]}</span></div>
     <div class="bar"><i style="width:${d[1]||0}%;background:${clr(d[1]>=75?100:d[1]>=55?80:50)}"></i></div></div>`).join('');
  return `<div class="panel"><h3>Termômetro de ligações e reuniões</h3>
    <div class="sub">${p.call.n} reunião(ões) · zona: <b style="color:${c}">${zoneWord(s)}</b>${p.call.talk_ratio!=null?' · vendedor falou '+p.call.talk_ratio+'%':''}</div>
    <div class="thermowrap">
      <div class="thermo" style="width:64px"><div class="zones"><span>Forte</span><span>No caminho</span><span>Ajustar</span></div></div>
      <div class="thermo" style="width:52px"><div class="tube"><i style="height:${s}%;background:linear-gradient(180deg,${c},${c}99)"></i></div><div class="bulb" style="background:${c}">${s}</div></div>
      <div class="dims">${dims}</div></div></div>`;
}
function insights(list){
  let items=[];
  list.forEach(p=>{ p.kpis.forEach(k=>{ const r=pctK(k); if(r!=null&&r<80) items.push({p,k,r:r/100,tipo:'kpi'}); });
    if(p.call && p.call.overall<70){ const ins=(p.call.ultimas&&p.call.ultimas[0]&&p.call.ultimas[0].insight)||null; items.push({p,r:p.call.overall/100,tipo:'call',ins,s:p.call.overall}); } });
  items.sort((a,b)=>a.r-b.r);
  if(!items.length) items=[{tipo:'ok'}];
  return `<div class="panel"><h3>Onde apertar</h3><div class="sub">Prioridade do maior gap para o menor</div>
    <div class="ins">${items.slice(0,6).map(it=>{
      if(it.tipo==='ok') return `<div class="insrow" style="border-left-color:var(--green)"><div class="tx">Todos dentro do ritmo nos indicadores com meta definida.</div></div>`;
      if(it.tipo==='call') return `<div class="insrow" style="border-left-color:var(--red)"><div class="tx"><b>${it.p.nome}</b> — qualidade das reuniões em <b>${it.s}</b> (${zoneWord(it.s)}).${it.ins?`<small>${it.ins}</small>`:''}</div></div>`;
      const pc=Math.round(it.r*100), c=pc>=75?'var(--amber)':'var(--red)';
      return `<div class="insrow" style="border-left-color:${c}"><div class="tx"><b>${it.p.nome}</b> — ${it.k.lab.toLowerCase()} em <b>${fmt(it.k,it.k.real)}</b> de ${fmt(it.k,it.k.meta)} (${pc}%).<small>${it.p.papel==='SDR/BDR'?'Topo de funil':'Fundo de funil'} · faltam ${fmt(it.k,Math.max(0,it.k.meta-it.k.real))}.</small></div></div>`;
    }).join('')}</div></div>`;
}
function pulseCards(list){ return `<div class="panel"><h3>Pulso do time</h3><div class="sub">Clique para abrir o detalhe de cada pessoa</div>
   <div class="pulse">${list.map(p=>{const a=attain(p),s=callScore(p);
     return `<div class="pcard" onclick="openPerson('${p.id}')"><div class="top">
       <div class="av" style="width:34px;height:34px;font-size:13px;border-radius:11px;background:${p.cor}">${p.ini}</div>
       <div><div class="nm">${p.nome}</div><div class="rl">${p.papel} · ${p.funil}</div></div></div>
       <div class="mini">${p.kpis.map(k=>{const pc=pctK(k);return `<i>${pc!=null?`<b style="width:${Math.min(100,pc)}%;background:${clr(pc)}"></b>`:''}</i>`;}).join('')}</div>
       <div class="pfoot"><span style="color:${stColor(a)};font-weight:700">● ${stWord(a)}</span><span>${s!=null?'reuniões '+s:'—'}</span></div></div>`;}).join('')}</div></div>`; }
function cardsDia(p){
  const c=p.cards; if(!c) return '';
  const dias=Object.keys(c.porDia||{}).sort();
  const metaDia=c.metaDia||0;
  const max=Math.max(1, metaDia, ...dias.map(d=>c.porDia[d]));
  const bars=dias.map(d=>{ const n=c.porDia[d]; const h=Math.round(n/max*100);
    const col= metaDia? (n>=metaDia?'var(--green)':'var(--amber)') : 'var(--blue)';
    return `<div style="flex:1;min-width:26px;display:flex;flex-direction:column;align-items:center;gap:4px">
      <div style="font-size:10px;color:var(--mut);font-variant-numeric:tabular-nums">${n}</div>
      <div style="width:100%;height:70px;background:#0b0f16;border-radius:5px;display:flex;align-items:flex-end;overflow:hidden"><div style="width:100%;height:${h}%;background:${col};border-radius:5px 5px 0 0"></div></div>
      <div style="font-size:9px;color:var(--mut2)">${d.slice(8)}/${d.slice(5,7)}</div></div>`; }).join('');
  return `<div class="panel"><h3>Cards abertos por dia</h3>
    <div class="sub">${c.total} no período${metaDia?` · meta ${metaDia}/dia`:' · sem meta/dia definida'} — funis Captação Ativa + Copiloto</div>
    <div style="display:flex;gap:6px;align-items:flex-end;overflow-x:auto;padding-top:4px">${bars||'<div class="empty" style="width:100%">Nenhum card aberto no período.</div>'}</div></div>`;
}
function personDetail(p){ const a=attain(p);
  return `<div class="panel idcard"><div class="av" style="background:${p.cor}">${p.ini}</div>
      <div class="idmeta"><div class="nm">${p.nome}${p.novo?' <span class="tag" style="border-color:var(--amber);color:var(--amber)">onboarding</span>':''}</div>
        <div class="tags"><span class="tag">${p.papel}</span><span class="tag">${p.squad}</span><span class="tag">${p.funil}</span></div></div>
      <div class="statusbig" style="background:${stColor(a)}22;color:${stColor(a)}">● ${stWord(a)}${a!=null?' · '+a+'%':''}</div></div>
    <div class="panel"><h3>Indicadores · Realizado × Meta</h3><div class="sub">Metas escaladas pelos dias úteis do período</div>
      <div class="kgrid">${p.kpis.map(kpiCard).join('')}</div></div>
    ${cardsDia(p)}
    <div class="two">${thermo(p)}${insights([p])}</div>`; }
function groupView(list,titulo){ const at=list.map(attain).filter(x=>x!=null), qs=list.map(callScore).filter(x=>x!=null);
  const am=at.length?Math.round(at.reduce((a,b)=>a+b,0)/at.length):null, qm=qs.length?Math.round(qs.reduce((a,b)=>a+b,0)/qs.length):null;
  return pulseCards(list) + `<div class="two">${insights(list)}
    <div class="panel"><h3>Resumo · ${titulo}</h3><div class="sub">Média de atingimento e qualidade de reuniões</div>
    <div class="kgrid">
      <div class="kpi"><div class="lab"><span>Atingimento médio</span></div><div class="val">${am==null?'—':am+'%'}</div><div class="bar"><i style="width:${am||0}%;background:var(--blue)"></i></div></div>
      <div class="kpi"><div class="lab"><span>Qualidade das reuniões</span></div><div class="val">${qm==null?'—':qm}</div><div class="bar"><i style="width:${qm||0}%;background:var(--violet)"></i></div></div>
      <div class="kpi"><div class="lab"><span>Pessoas no ritmo</span></div><div class="val">${list.filter(p=>attain(p)>=90).length} <small>/ ${list.length}</small></div></div>
    </div></div></div>`; }

function syncSeg(){ document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===view)); }
function openPerson(id){ view='vendedor'; sel=id; syncSeg(); render(); }
function buildChips(arr){ chips.style.display='flex'; chips.innerHTML=arr.map(([id,nm,a])=>`<div class="chip" data-id="${id}" onclick="pick('${id}')"><span class="st" style="background:${stColor(a)}"></span>${nm}</div>`).join(''); }
function markChips(id){ document.querySelectorAll('#chips .chip').forEach(c=>c.classList.toggle('on',c.dataset.id==id)); }
function pick(id){ sel=id; markChips(id); render(); }
const grpAttain=l=>{const x=l.map(attain).filter(v=>v!=null);return x.length?Math.round(x.reduce((a,b)=>a+b,0)/x.length):null;};

function render(){
  chips.style.display='none'; chips.innerHTML='';
  if(!P.length){ stage.innerHTML='<div class="empty">Sem dados no período.</div>'; return; }
  const byFunc={'SDR/BDR':P.filter(p=>p.papel==='SDR/BDR'),'Sales REP':P.filter(p=>p.papel==='Sales REP'),'Copiloto':P.filter(p=>p.squad==='Copiloto'),'Captação Ativa':P.filter(p=>p.squad==='Captação Ativa')};
  const byFunil={'Funil 7':P.filter(p=>p.funil==='Funil 7'),'Funil 2':P.filter(p=>p.funil==='Funil 2'),'Funil 21':P.filter(p=>p.funil==='Funil 21')};
  if(view==='time'){ stage.innerHTML = pulseCards(P) + `<div class="two">${insights(P)}${resumoTime()}</div>`; return; }
  if(view==='vendedor'){ buildChips(P.map(p=>[p.id,p.nome,attain(p)])); if(sel==null||!P.find(p=>p.id==sel)) sel=P[0].id; markChips(sel); stage.innerHTML=personDetail(P.find(p=>p.id==sel)); return; }
  if(view==='funcao'){ const ks=Object.keys(byFunc); buildChips(ks.map(k=>[k,k,grpAttain(byFunc[k])])); if(!byFunc[sel]) sel=ks[0]; markChips(sel); stage.innerHTML=groupView(byFunc[sel],sel); return; }
  if(view==='funil'){ const ks=Object.keys(byFunil); buildChips(ks.map(k=>[k,k,grpAttain(byFunil[k])])); if(!byFunil[sel]) sel=ks[0]; markChips(sel); stage.innerHTML=groupView(byFunil[sel],sel); return; }
}
function resumoTime(){ const am=grpAttain(P), qs=P.map(callScore).filter(x=>x!=null), qm=qs.length?Math.round(qs.reduce((a,b)=>a+b,0)/qs.length):null;
  return `<div class="panel"><h3>Resumo do time</h3><div class="sub">${P.length} pessoas no período</div>
   <div class="kgrid">
     <div class="kpi"><div class="lab"><span>Atingimento médio</span></div><div class="val">${am==null?'—':am+'%'}</div><div class="bar"><i style="width:${am||0}%;background:var(--blue)"></i></div></div>
     <div class="kpi"><div class="lab"><span>Qualidade das reuniões</span></div><div class="val">${qm==null?'—':qm}</div><div class="bar"><i style="width:${qm||0}%;background:var(--violet)"></i></div></div>
     <div class="kpi"><div class="lab"><span>No ritmo</span></div><div class="val">${P.filter(p=>attain(p)>=90).length}<small> / ${P.length}</small></div></div>
   </div></div>`; }

function pad(n){return String(n).padStart(2,'0');}
function isoD(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function periodRange(){
  const now=new Date();
  if(period==='hoje'){ const t=isoD(now); return [t,t]; }
  if(period==='semana'){ const mon=new Date(now); const wd=(now.getDay()+6)%7; mon.setDate(now.getDate()-wd); return [isoD(mon),isoD(now)]; }
  if(period==='mes'){ return [isoD(new Date(now.getFullYear(),now.getMonth(),1)),isoD(now)]; }
  const a=document.getElementById('d1').value, b=document.getElementById('d2').value;
  return [a||isoD(new Date(now.getFullYear(),now.getMonth(),1)), b||isoD(now)];
}
function periodLabel(r){ return period==='hoje'?'Hoje':period==='semana'?'Esta semana':period==='mes'?'Este mês':(r[0]+' → '+r[1]); }

async function load(){
  const r=periodRange();
  crumb.textContent='carregando · '+periodLabel(r);
  stage.innerHTML='<div class="spin">Carregando dados reais…</div>';
  try{
    const resp=await fetch(`/api/tpc?view=radar&from=${r[0]}&to=${r[1]}`);
    const d=await resp.json();
    if(d.error) throw new Error(d.error);
    P=d.vendedores||[];
    // Colaborador (não-gestão) só enxerga o próprio card; esconde o seletor de recorte do time.
    if(!ADMIN){
      document.getElementById('seg').style.display='none';
      P = MYEMAIL ? P.filter(p=>(p.email||'').toLowerCase()===MYEMAIL) : [];
      view='vendedor'; sel = P[0]?P[0].id:null;
    }
    crumb.textContent=`${periodLabel(r)} · ${d.periodo?d.periodo.dias_uteis+' dias úteis':''} · atualizado ${new Date(d.gerado_em).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;
    if(!ADMIN && !P.length){ stage.innerHTML='<div class="empty">Você não tem indicadores no Radar.<br>Fale com a gestão se isso não estiver certo.</div>'; return; }
    render();
  }catch(e){ stage.innerHTML=`<div class="empty">Erro ao carregar dados: ${e.message}</div>`; crumb.textContent='erro'; }
}

document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{ view=b.dataset.v; sel=null; syncSeg(); render(); });
document.querySelectorAll('#pseg button').forEach(b=>b.onclick=()=>{ period=b.dataset.p; document.querySelectorAll('#pseg button').forEach(x=>x.classList.toggle('on',x===b)); document.getElementById('range').style.display=period==='custom'?'flex':'none'; load(); });
document.getElementById('d1').onchange=load; document.getElementById('d2').onchange=load;
resolvePerm().then(load);
</script>
</body>
